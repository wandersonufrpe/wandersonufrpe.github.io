# Publica o site no GitHub Pages a cada envio (push) para a branch main.
# Ativação, uma única vez: no GitHub, Settings > Pages > Build and deployment > Source: "GitHub Actions".
# O modo revisão (rascunhos) nunca é publicado: aqui o render roda sem perfil.

name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar o Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Gerar o site
        run: quarto render

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Enviar o site gerado
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
